AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lets one GitHub repository deploy the SkillOps stack, without any AWS access keys.
  Run once by the AWS administrator (see docs/AWS_ADMIN_NOTE.md).

Parameters:
  GitHubRepository:
    Type: String
    Default: brrikcy/skillOps
    Description: owner/name of the repository, written exactly as GitHub shows it (capital letters count).
  GitHubEnvironment:
    Type: String
    Default: production
    Description: The GitHub environment the deploy job runs in. Only jobs in this environment may use the role.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      "true" adds GitHub as a trusted sign-in provider for this AWS account. Choose "false" if the account already
      has one (IAM > Identity providers shows token.actions.githubusercontent.com).
  PolicyArn:
    Type: String
    Default: arn:aws:iam::aws:policy/AdministratorAccess
    Description: >
      What the role may do. AdministratorAccess is the simplest way to start; the role can only be used by the one
      repository and environment above. Replace it with a narrower policy later if you wish.

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SkillOpsGitHubDeploy
      Description: Deploys the SkillOps stack from GitHub Actions
      MaxSessionDuration: 3600
      ManagedPolicyArns: [!Ref PolicyArn]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:environment:${GitHubEnvironment}

Outputs:
  RoleArn:
    Description: Send this to the person who runs the deploy. It is not a secret.
    Value: !GetAtt DeployRole.Arn
