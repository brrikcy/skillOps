# Deploys SkillOps to AWS from GitHub, with no AWS keys stored anywhere.
#
# It never runs by itself. Someone presses "Run workflow" in the Actions tab, types "deploy" to confirm, and (if the
# "production" environment asks for approval) a reviewer approves. AWS trusts only this repository's "production"
# environment, through the role set up with deploy/github-oidc-role.yaml (see docs/AWS_ADMIN_NOTE.md).
#
# Settings it reads (GitHub: Settings > Secrets and variables > Actions > Variables; none of them is secret):
#   AWS_DEPLOY_ROLE_ARN   the role the AWS administrator created (required)
#   SUPERADMIN_EMAIL      the first Supervisor; AWS emails this address a temporary password (required)
#   SUPERADMIN_NAME       that person's name (optional, default "Supervisor")
#   ALARM_EMAIL           where alarm and budget emails go (optional, default: the Supervisor's email)
#   SUPPORT_EMAIL         where people write for help; shows a feedback link in the app (optional)
#   MONTHLY_BUDGET_USD    cost warning level in US dollars (optional, default 10)
#   WEB_DOMAIN_NAME, WEB_CERTIFICATE_ARN   a custom web address (optional; set both or neither)
name: Deploy to AWS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm'
        required: true
        type: string

concurrency:
  group: skillops-deploy
  cancel-in-progress: false            # never stop a deploy half way

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  STACK_NAME: skillops

jobs:
  check:
    name: Run the tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Confirm
        if: ${{ inputs.confirm != 'deploy' }}
        run: |
          echo 'Nothing deployed: the confirmation was not "deploy".'
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install
        run: pip install -r requirements-dev.txt -c requirements-dev.lock
      - name: Tests
        run: python -m pytest -q

  deploy:
    name: Build and deploy
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production            # AWS accepts sign-in only from this environment; add reviewers here if you like
    permissions:
      id-token: write                  # lets GitHub prove to AWS who is asking
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Let the Linux runner build for Graviton (arm64), which the functions use
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Sign in to AWS (no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: skillops-github-deploy
      - name: Check the settings
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          EMAIL: ${{ vars.SUPERADMIN_EMAIL }}
        run: |
          test -n "$ROLE"  || { echo "Set the variable AWS_DEPLOY_ROLE_ARN."; exit 1; }
          test -n "$EMAIL" || { echo "Set the variable SUPERADMIN_EMAIL."; exit 1; }
          aws sts get-caller-identity --query Arn --output text
      - name: Build
        run: sam build --use-container
      - name: Deploy
        env:
          SUPERADMIN_EMAIL: ${{ vars.SUPERADMIN_EMAIL }}
          SUPERADMIN_NAME: ${{ vars.SUPERADMIN_NAME || 'Supervisor' }}
          ALARM_EMAIL: ${{ vars.ALARM_EMAIL }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          MONTHLY_BUDGET_USD: ${{ vars.MONTHLY_BUDGET_USD || '10' }}
          WEB_DOMAIN_NAME: ${{ vars.WEB_DOMAIN_NAME }}
          WEB_CERTIFICATE_ARN: ${{ vars.WEB_CERTIFICATE_ARN }}
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --region "$AWS_REGION" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "PlatformName=SkillOps" \
              "LiveDataName=Live Data Simulator" \
              "SuperadminEmail=$SUPERADMIN_EMAIL" \
              "SuperadminName=$SUPERADMIN_NAME" \
              "AlarmEmail=$ALARM_EMAIL" \
              "SupportEmail=$SUPPORT_EMAIL" \
              "MonthlyBudgetUSD=$MONTHLY_BUDGET_USD" \
              "SessionHours=12" \
              "WebDomainName=$WEB_DOMAIN_NAME" \
              "WebCertificateArn=$WEB_CERTIFICATE_ARN"
      - name: Show the address
        run: |
          {
            echo "## SkillOps is deployed"
            echo
            echo "| Output | Value |"
            echo "|---|---|"
            aws cloudformation describe-stacks --stack-name "$STACK_NAME" --region "$AWS_REGION" \
              --query "Stacks[0].Outputs[].[OutputKey,OutputValue]" --output text | awk -F'\t' '{print "| " $1 " | " $2 " |"}'
            echo
            echo "Open **WebUrl** to sign in. Details: docs/DEPLOY_WITH_GITHUB.md"
          } >> "$GITHUB_STEP_SUMMARY"
