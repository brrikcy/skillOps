<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · {{ platform_name() }}</title>
<link rel="stylesheet" href="{{ static('style.css') }}">
<link rel="icon" href="{{ static('favicon.svg') }}" type="image/svg+xml">
</head>
<body>
<div class="signin-wrap">
  <div class="signin-card">
    <div class="signin-brand">
      <img src="{{ static('robomy-logo.png') }}" alt="{{ company() }}" class="signin-robomy">
      <img src="{{ static('skillops-logo.svg') }}" alt="{{ platform_name() }}" class="signin-skillops">
    </div>
    {% if local_mode() %}<div class="local-note">Local mode on this laptop</div>{% endif %}
    {% if flash %}<div class="flash {{ flash.kind }}" role="status">{{ flash.message }}</div>{% endif %}
    {% if error %}<div class="flash bad" role="alert"><div><strong>{{ error.message }}</strong>{% if error.next_step %} {{ error.next_step }}{% endif %}</div></div>{% endif %}
    {% block content %}{% endblock %}
  </div>
</div>
<script src="{{ static('app.js') }}" defer></script>
</body>
</html>
