{% extends "signin_base.html" %}
{% block content %}
<h1>Choose your password</h1>
<p class="muted small">Welcome, {{ email }}. This is your first sign-in. Use at least 10 characters with a capital letter, a small letter and a number.</p>
<form method="post" action="/signin/new-password">
  <input type="hidden" name="c" value="{{ c }}">
  <label>New password<input type="password" name="password" autocomplete="new-password" required minlength="10"></label>
  <label>Type it again<input type="password" name="password2" autocomplete="new-password" required minlength="10"></label>
  <button type="submit" class="btn primary">Save and sign in</button>
</form>
{% endblock %}
