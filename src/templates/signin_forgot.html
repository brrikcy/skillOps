{% extends "signin_base.html" %}
{% block content %}
<h1>Forgot password</h1>
<p class="muted small">Type your email. We will email you a code to set a new password.</p>
<form method="post" action="/signin/forgot">
  <label>Email<input type="email" name="email" value="{{ email }}" required autofocus></label>
  <button type="submit" class="btn primary">Email me a code</button>
</form>
<div class="signin-foot"><a href="/signin">Back to sign in</a><a href="/signin/reset">I have a code</a></div>
{% endblock %}
