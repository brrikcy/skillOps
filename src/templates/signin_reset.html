{% extends "signin_base.html" %}
{% block content %}
<h1>Set a new password</h1>
<form method="post" action="/signin/reset">
  <label>Email<input type="email" name="email" value="{{ email }}" required></label>
  <label>Code from the email<input type="text" name="code" inputmode="numeric" autocomplete="one-time-code" required></label>
  <label>New password<input type="password" name="password" autocomplete="new-password" required minlength="10"></label>
  <label>Type it again<input type="password" name="password2" autocomplete="new-password" required minlength="10"></label>
  <button type="submit" class="btn primary">Save new password</button>
</form>
<div class="signin-foot"><a href="/signin">Back to sign in</a><a href="/signin/forgot">Send a new code</a></div>
{% endblock %}
